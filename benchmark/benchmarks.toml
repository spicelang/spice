# Registry of the benchmarks, that benchmark/run-benchmarks.py runs. See media/specs/benchmarks.md.

[defaults]
runs = 5   # Measured wall-time runs per benchmark and compiler
warmup = 1 # Unmeasured runs per benchmark and compiler before the measured ones

# A gated measure regresses, if the candidate exceeds the baseline by more than this many percent
[defaults.thresholds]
instructions = 2.0
max-rss = 5.0
file-size = 3.0

# ... and the absolute change exceeds this minimum delta. The peak memory usage of small programs fluctuates by up to
# 12 % (0.5 MiB) between runs, which a relative threshold alone cannot tell apart from a regression
[defaults.min-deltas]
max-rss = 1048576 # 1 MiB

# Wall-time and stage-time differences are not gated. They are highlighted in the report, if they exceed this many
# percent and the Mann-Whitney U test reports a p-value below 'p-value'
[defaults.warnings]
percent = 10.0
p-value = 0.01

# Compile-time benchmarks: compile a program and measure the compiler. The source is benchmark/compile/<name>/source.spice,
# or generated by the function 'generator' in benchmark/generators.py with the given scale. A config is
# '<opt level>-<backend>'. TPDE configs are skipped, if a compiler under test is not backed by TPDE.

[[compile]]
name = "hello-world"
configs = ["O0-llvm", "O2-llvm", "O0-tpde"]

[[compile]]
name = "std-generics"
configs = ["O0-llvm", "O2-llvm", "O0-tpde"]

[[compile]]
name = "many-instantiations"
generator = "many_instantiations"
scale = 100
configs = ["O0-llvm", "O2-llvm"]

[[compile]]
name = "deep-imports"
generator = "deep_imports"
scale = 100
configs = ["O0-llvm", "O2-llvm"]

# The O2 compile time grows steeply with the size of the function (about 1 s for scale 200, 44 s for scale 1000), so the
# O2 config uses a smaller function
[[compile]]
name = "large-function"
generator = "large_function"
scale = 1000
configs = ["O0-llvm"]

[[compile]]
name = "large-function"
generator = "large_function"
scale = 200
configs = ["O2-llvm"]

# Runtime benchmarks: compile benchmark/runtime/<name>/source.spice (not measured) and measure the executable. The
# instruction count is measured with the small workload 'args-instructions', the wall time with 'args-wall-time'.

[[runtime]]
name = "binary-trees"
opt-level = "O2"
args-instructions = ["12"]
args-wall-time = ["17"]

[[runtime]]
name = "n-body"
opt-level = "O2"
args-instructions = ["20000"]
args-wall-time = ["2000000"]

[[runtime]]
name = "fannkuch"
opt-level = "O2"
args-instructions = ["8"]
args-wall-time = ["10"]

[[runtime]]
name = "sieve"
opt-level = "O2"
args-instructions = ["1000000"]
args-wall-time = ["50000000"]

[[runtime]]
name = "hash-map"
opt-level = "O2"
args-instructions = ["50000"]
args-wall-time = ["2000000"]

[[runtime]]
name = "string-builder"
opt-level = "O2"
args-instructions = ["100000"]
args-wall-time = ["4000000"]

[[runtime]]
name = "regex"
opt-level = "O2"
args-instructions = ["1000"]
args-wall-time = ["20000"]

# The compiler compiles its own sources (src/main.spice of its checkout) with the flags of the build type in build.py. The
# 'stage1' variant repeats the compilation with the compiler built by the first one, which shows the effect of code
# generation changes on a large program. The instruction count is only measured in the 'full' suite.

[self-compile]
build-type = "Release"
runs = 3
warmup = 0
