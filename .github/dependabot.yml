version: 2
updates:
  # Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    target-branch: main
    reviewers:
      - spicelang/compiler-team
    assignees:
      - marcauberer

  # GitHub Actions
  - package-ecosystem: github-actions
    # The composite actions use actions as well
    directories:
      - /.github/workflows
      - /.github/actions/*
    schedule:
      interval: daily
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    target-branch: main
    reviewers:
      - spicelang/compiler-team
    assignees:
      - marcauberer

  # Python
  - package-ecosystem: pip
    directory: docs/
    schedule:
      interval: weekly # Weekly, because material for mkdocs updates quite often
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    target-branch: main
    reviewers:
      - spicelang/documentation-team
    assignees:
      - marcauberer
