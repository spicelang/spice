# C++ CI
name: C++ CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - '**.md'

env:
  LLVM_VERSION: "llvmorg-23.1.1"
  GCC_VERSION: "16"
  # Built from source for macOS only - see the 'Build libbacktrace' step in the macOS job
  LIBBACKTRACE_VERSION: "0b9b49cf4a2c9229fc052d6716e1528b2f23e91a"

jobs:
  build-linux-x86:
    name: C++ CI - Linux/x86_64
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install ccache ninja-build graphviz uuid-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          mkdir -p ~/.cache/ccache

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_ENABLE_TPDE=ON \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spicetest

      - name: Run Test target
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-linux-aarch64:
    name: C++ CI - Linux/AArch64
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install ccache ninja-build graphviz uuid-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          mkdir -p ~/.cache/ccache

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-aarch64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_ENABLE_TPDE=ON \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spicetest

      - name: Run Test target
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-windows-x86:
    name: C++ CI - Windows/x86_64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          choco install graphviz ccache ninja -y
          echo "C:\Program Files\Graphviz\bin" >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\ccache"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          # The compiler links via clang's GNU driver (--target=x86_64-w64-windows-gnu, MinGW), which reads
          # LIBRARY_PATH for '-l' search dirs, not the MSVC-only LIB variable.
          echo "LIBRARY_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIBRARY_PATH" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      # The stack trace runtime links '-lbacktrace'. This runner has no libbacktrace to link against: the MinGW
      # GCC here does not carry one ('gcc -print-file-name=libbacktrace.a' finds nothing), and vcpkg's port is
      # marked '"supports": "!windows"' because the library cannot be built with MSVC at all. So it is built from
      # source with MSYS2's MinGW GCC, which produces the same ABI clang targets with
      # '--target=x86_64-w64-windows-gnu' - the same recipe the macOS job uses, for the same reason.
      - name: Cache libbacktrace
        id: cache-libbacktrace
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/libbacktrace-install
          key: libbacktrace-${{ env.LIBBACKTRACE_VERSION }}-windows-x86_64

      - name: Setup MSYS2
        if: steps.cache-libbacktrace.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: git make mingw-w64-x86_64-gcc

      - name: Build libbacktrace
        if: steps.cache-libbacktrace.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git libbacktrace-src
          cd libbacktrace-src
          git checkout ${{ env.LIBBACKTRACE_VERSION }}
          ./configure --prefix="$(cygpath -u '${{ github.workspace }}')/libbacktrace-install" --disable-shared
          make -j$(nproc)
          make install

      - name: Setup libbacktrace
        run: |
          # clang reads LIBRARY_PATH for '-l' search dirs, same as the vcpkg entry above
          echo "LIBRARY_PATH=${{ github.workspace }}\libbacktrace-install\lib;$env:LIBRARY_PATH" >> $env:GITHUB_ENV

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-win-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" `
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
          CMAKE_TLS_VERIFY: "1"
          SSL_CERT_FILE: "C:\\cacert.pem"
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DSPICE_BUILT_BY="ghactions" `
            -DSPICE_TEST_ARGS=--is-github-actions `
            ..
          cmake --build . --target spicetest

      - name: Run Test target
        working-directory: build
        run: |
          cmake --build . --target spicetest_parallel

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-macos-aarch64:
    name: C++ CI - MacOS/AArch64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Setup Dependencies
        run: |
          brew update
          brew install ccache graphviz sqlite
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          mkdir -p ~/Library/Caches/ccache

      # The stack trace runtime links '-lbacktrace'. GCC ships libbacktrace as part of its own runtime, so Linux
      # and MinGW have it already, but the Apple toolchain does not and Homebrew has no formula for it - so it is
      # built from source here. Static only: nothing then has to be found again at run time.
      - name: Cache libbacktrace
        id: cache-libbacktrace
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/libbacktrace-install
          key: libbacktrace-${{ env.LIBBACKTRACE_VERSION }}-macos-aarch64

      - name: Build libbacktrace
        if: steps.cache-libbacktrace.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git libbacktrace-src
          cd libbacktrace-src
          git checkout ${{ env.LIBBACKTRACE_VERSION }}
          ./configure --prefix="${{ github.workspace }}/libbacktrace-install" --disable-shared
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Setup libbacktrace
        run: |
          # clang reads LIBRARY_PATH for '-l' search dirs, which is how the Spice linker invocation finds it
          echo "LIBRARY_PATH=${{ github.workspace }}/libbacktrace-install/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-macos-aarch64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spicetest

      - name: Run Test target
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
