name: Coverage

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - '**.md'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  coverage-linux-x86:
    name: Coverage - Linux/x86_64
    runs-on: ubuntu-26.04
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Linux toolchain
        id: toolchain
        uses: ./.github/actions/setup-linux-toolchain
        with:
          extra-packages: pipx
          ccache-key-suffix: -coverage

      - name: Install gcovr
        run: sudo pipx install gcovr

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          cache-key-suffix: linux-x64
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      - name: Build llvm-cov
        # Needed to read the gcov data Spice's own --coverage instrumentation emits (see "Run Test target (compiler
        # coverage)" and "Run Test target (Spice coverage)" below) - GNU gcov cannot parse it, only llvm-cov
        # gcov can. LLVM_BUILD_TOOLS=OFF (see setup-llvm) excludes tools from the default build, but their targets stay
        # individually buildable, so this only builds the one tool we need. Runs unconditionally (not gated on the LLVM cache step) so a cache hit still produces it.
        working-directory: llvm/build
        run: cmake --build . --target llvm-cov

      - name: Download Libs
        # --tpde builds TPDE into the std, for the TPDE backend of the compiler and the std TPDE bindings
        run: python setup-deps.py --tpde

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler from src/
        run: python fetch-stage0.py

      - name: Run Test target (compiler coverage)
        # Builds the compiler with Spice code coverage instrumentation (with the stage0 compiler) and runs the test suites
        # against it, to collect gcov data for the compiler sources. Same test selection as the run in ci.yml. The gcov data
        # lands next to the object files in build/test-tmp (see coverage.py).
        #
        # continue-on-error: this run's only purpose is collecting coverage data (correctness is already verified by the
        # run in ci.yml), so a single failing test should not block generating/uploading the reports below with whatever
        # data the rest of the run did collect.
        continue-on-error: true
        run: python test/run-tests.py --build-compiler build/stage0/spice --instrument coverage --is-github-actions

      - name: Run Test target (Spice coverage)
        # Builds the compiler (without instrumentation) and compiles every test program with Spice code coverage
        # instrumentation, to collect gcov data for the std lib code they exercise. --coverage forces debug info on for every
        # compiled test program, which changes the emitted LLVM IR, so this run skips all reference comparisons and just
        # compiles, links and executes every test program that would normally run. It uses its own work dir, since the
        # compiler coverage run above keeps its data in build/test-tmp (see coverage.py).
        #
        # continue-on-error: this run's only purpose is collecting coverage data (correctness is already verified by the
        # run in ci.yml), and under sustained load across hundreds of compiles, LLVM's GCOVProfilerPass has occasionally
        # failed to open a single .gcno file, failing just that one test. A rare, isolated miss like that should not block
        # generating/uploading the reports below with whatever data the rest of the run did collect.
        continue-on-error: true
        run: python test/run-tests.py --build-compiler build/stage0/spice --coverage --work-dir build/test-tmp-coverage --is-github-actions

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.toolchain.outputs.ccache-key }}

      - name: Generate coverage reports
        env:
          LLVM_COV: ${{ github.workspace }}/llvm/build/bin/llvm-cov
        run: python coverage.py

      - name: Upload coverage report
        uses: Dylan700/sftp-upload-action@v1.2.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          uploads: |
            ./build/coverage-compiler/ => coverage/
            ./build/coverage-spice/ => coverage/std/
          delete: 'true'
