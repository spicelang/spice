name: Benchmark

# Nightly performance check, see media/specs/benchmarks.md. The nightly run benchmarks the head of main against the
# commit, that the previous nightly run benchmarked: both compilers are built and measured in the same job, so that they
# run on the same machine. The run fails, if a gated measure (instruction count, peak memory usage, file size) regressed
# beyond its threshold. Every commit range is compared once: the next run compares against the benchmarked commit, also
# if it regressed.
#
# Manual runs: the mode 'nightly' benchmarks the selected branch in the same way, optionally against a given baseline
# commit (e.g. the merge base of a PR branch). The mode 'noise' measures the A/A noise of the gated measures on the runner
# (the same compiler benchmarked repeatedly), which the thresholds in benchmark/benchmarks.toml have to cover.
#
# The scheduled runs upload the results of the head compiler to the Bencher project 'spice' (job 'history'), which draws
# the trend graphs (https://bencher.dev/perf/spice). It needs the repository secret BENCHER_API_KEY (a project API key)
# and is skipped without it.

on:
  # Every night at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'nightly: compare against a baseline commit, noise: A/A noise measurement'
        type: choice
        options: [nightly, noise]
        default: nightly
      baseline:
        description: 'Baseline commit of the nightly mode. Default: the commit of the previous nightly run'
        type: string
        default: ''
      repetitions:
        description: Repetitions of the A/A noise measurement
        type: number
        default: 10

# Nightly runs are queued, not canceled, so that each run sees the results artifact of the previous one
concurrency:
  group: benchmark-${{ (inputs.mode || 'nightly') == 'nightly' && 'nightly' || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Benchmark baseline
    # Scheduled workflows of forks are disabled by default, but they can be enabled
    if: github.repository == 'spicelang/spice' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.baseline.outputs.mode }}
      baseline: ${{ steps.baseline.outputs.baseline }}
      run: ${{ steps.baseline.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # The history (without file contents) to find the baseline and the changed files
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Determine the baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode || 'nightly' }}
          INPUT_BASELINE: ${{ inputs.baseline }}
        run: |
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" != "nightly" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head="$(git rev-parse HEAD)"
          if [ -n "$INPUT_BASELINE" ]; then
            baseline="$(git rev-parse --verify "$INPUT_BASELINE^{commit}")"
          else
            # The commit of the previous nightly run: the newest unexpired 'benchmark-nightly' artifact of a run on main.
            # Only scheduled runs upload it, and only if the comparison succeeded, so a failed build or run does not move
            # the baseline. A failing API call fails the step (no pipeline, whose status would be lost)
            artifacts="$(gh api --method GET --paginate "repos/$REPO/actions/artifacts" -f name=benchmark-nightly \
              -f per_page=100 --jq '.artifacts[]')"
            baseline="$(jq -rs '[.[] | select((.expired | not) and .workflow_run.head_branch == "main")]
              | sort_by(.created_at) | last | .workflow_run.head_sha // empty' <<< "$artifacts")"
            if [ -n "$baseline" ] && ! git merge-base --is-ancestor "$baseline" "$head"; then
              echo "::warning::The commit $baseline of the previous nightly run is not an ancestor of $head"
              baseline=""
            fi
            if [ -z "$baseline" ]; then
              baseline="$(git rev-parse HEAD^)"
              echo "::notice::No previous nightly run found, comparing against the parent commit $baseline"
            fi
          fi
          echo "Baseline: $baseline, head: $head"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

          if [ "$baseline" = "$head" ]; then
            echo "::notice::No new commits since the previous nightly run"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Like the paths-ignore of ci.yml: docs/**, media/** and **.md do not affect the benchmarks
          run=false
          if git diff --name-only "$baseline" "$head" | grep -qvE '^(docs/|media/)|\.md$'; then
            run=true
          else
            echo "::notice::No changes, that affect the benchmarks, since $baseline"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark - Linux/x86_64
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    # One platform is enough to detect regressions. Instruction counts of different platforms are not comparable anyway
    runs-on: ubuntu-26.04
    # The full suite counts the instructions of the self-compile benchmarks under cachegrind
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      # Set, if the results were uploaded as artifact, i.e. the comparison succeeded
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      MODE: ${{ needs.prepare.outputs.mode }}
      BASELINE: ${{ needs.prepare.outputs.baseline }}
      HEAD_SHA: ${{ github.sha }}
      # The two checkouts have paths of the same length ('head' and 'base'), so that the absolute paths, that the compilers
      # embed, have the same length. The base checkout reuses the ccache entries of the head checkout
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: head
          ref: ${{ github.sha }}
          # The full history is needed to check out the baseline (0 is falsy in expressions, so the condition is inverted)
          fetch-depth: ${{ needs.prepare.outputs.mode != 'nightly' && 1 || 0 }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout baseline
        if: env.MODE == 'nightly'
        run: |
          git -C head worktree add --detach ../base "$BASELINE"
          git -C base submodule update --init --recursive

      - name: Setup Linux toolchain
        uses: ./head/.github/actions/setup-linux-toolchain
        with:
          # valgrind counts the instructions, GNU time measures the peak memory usage of the executables
          extra-packages: valgrind time

      - name: Setup LLVM
        uses: ./head/.github/actions/setup-llvm
        with:
          cache-key-suffix: linux-x64
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      - name: Download Libs (head)
        # --tpde builds TPDE into the std, so that the TPDE benchmarks run
        working-directory: head
        run: python setup-deps.py --tpde

      - name: Download Libs (baseline)
        if: env.MODE == 'nightly'
        working-directory: base
        run: python setup-deps.py --tpde

      - name: Build compiler (head)
        # With the stage0 compiler pinned in the checkout, so that a stage0 bump is measured correctly
        working-directory: head
        run: |
          python fetch-stage0.py
          python build.py

      - name: Build compiler (baseline)
        if: env.MODE == 'nightly'
        working-directory: base
        run: |
          python fetch-stage0.py
          python build.py

      - name: Run benchmarks
        if: env.MODE == 'nightly'
        run: >-
          python head/benchmark/run-benchmarks.py run --suite full
          --compiler base=base/build/spice --compiler head=head/build/spice --output results/results.json

      - name: Compare results
        if: env.MODE == 'nightly'
        run: |
          # The report is only written, if the comparison succeeded. Exits with 1, if a gated measure regressed, which
          # fails the run after the report is published by the next steps
          python head/benchmark/run-benchmarks.py compare results/results.json --baseline base --candidate head \
            --markdown results/report.md

      - name: Run A/A noise measurement
        if: env.MODE == 'noise'
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          mkdir -p results
          python head/benchmark/run-benchmarks.py noise --compiler head/build/spice --repetitions "$REPETITIONS" \
            --output results/noise.json > results/report.md

      - name: Write job summary
        if: (success() || failure()) && hashFiles('results/report.md') != ''
        env:
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare
        run: |
          if [ "$MODE" = "nightly" ]; then
            echo "Commits: [\`${BASELINE:0:8}...${HEAD_SHA:0:8}\`]($COMPARE_URL/$BASELINE...$HEAD_SHA)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        id: upload
        # Also on a regression, so that the next nightly run compares against this commit
        if: (success() || failure()) && hashFiles('results/report.md') != ''
        uses: actions/upload-artifact@v7
        with:
          # The 'prepare' job of the next nightly run finds its baseline by the name 'benchmark-nightly'. Manual runs use
          # other names, since their commit range can differ from the one since the previous nightly run
          name: >-
            ${{ github.event_name == 'schedule' && 'benchmark-nightly'
            || env.MODE == 'nightly' && 'benchmark-manual' || 'benchmark-noise' }}
          path: results/
          retention-days: 90

  history:
    name: Upload to Bencher
    needs: benchmark
    # Also on a regression (the benchmark job failed, but uploaded its results). Only the scheduled runs on main build the
    # history, manual runs would add points of other branches or commit ranges. A job of its own, so that the API key is
    # never exposed to the job, that builds and runs the compilers
    if: >-
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
      needs.benchmark.outputs.artifact-id != ''
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    env:
      BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
      BENCHER_PROJECT: spice
    steps:
      - name: Check the Bencher configuration
        id: config
        run: |
          configured=true
          if [ -z "$BENCHER_API_KEY" ]; then
            echo "::notice::The secret BENCHER_API_KEY is not set, the upload is skipped"
            configured=false
          fi
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          # Only the runner, for its export command
          sparse-checkout: benchmark
          persist-credentials: false

      - name: Download results
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: benchmark-nightly
          path: results

      - name: Install the Bencher CLI
        if: steps.config.outputs.configured == 'true'
        uses: bencherdev/bencher@v0.6.16

      - name: Upload results
        if: steps.config.outputs.configured == 'true'
        run: |
          # The head compiler only, the baseline was uploaded by the previous nightly run. Bencher creates unknown
          # branches, testbeds, benchmarks and measures. Its thresholds are not used, the comparison is done by the runner
          python3 benchmark/run-benchmarks.py export results/results.json --compiler head > bmf.json
          bencher run --branch main --testbed ubuntu-26.04-x86_64 --hash "$GITHUB_SHA" --adapter json --file bmf.json
