name: Benchmark

# Pre-merge performance check, see media/specs/benchmarks.md. A pull request is benchmarked against its merge base: both
# compilers are built and measured in the same job, so that they run on the same machine. The check fails, if a gated
# measure (instruction count, peak memory usage, file size) regresses beyond its threshold, unless the PR has the label
# 'perf-regression-ok'. The PR comment is posted by benchmark-comment.yml.
#
# The manual run measures the A/A noise of the gated measures on the runner (the same compiler benchmarked repeatedly),
# which the thresholds in benchmark/benchmarks.toml have to cover.

on:
  pull_request:
    # labeled/unlabeled re-run the check, when 'perf-regression-ok' is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions of the A/A noise measurement
        type: number
        default: 10

# One run per PR, a new push cancels the outdated run. Events of other labels get a group of their own, so that they do not
# cancel the running check (their job is skipped below)
concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.run_id }}${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'perf-regression-ok' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark - Linux/x86_64
    if: >-
      github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'perf-regression-ok'
    # One platform is enough to detect regressions. Instruction counts of different platforms are not comparable anyway
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 120 }}
    # The job runs the downloaded stage0 compilers and the code of the PR, which need no write access and no git credentials
    permissions:
      contents: read
    env:
      # The two checkouts have paths of the same length ('head' and 'base'), so that the paths, that the compilers embed,
      # do not change the instruction counts. The base checkout reuses the ccache entries of the head checkout
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: head
          # The PR head, not the merge commit. The full history is needed to find the merge base
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # (0 is falsy in expressions, so the condition is inverted)
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout merge base
        if: github.event_name == 'pull_request'
        id: base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          merge_base="$(git -C head merge-base "$HEAD_SHA" "$BASE_SHA")"
          echo "Merge base: $merge_base"
          echo "sha=$merge_base" >> "$GITHUB_OUTPUT"
          git -C head worktree add --detach ../base "$merge_base"
          git -C base submodule update --init --recursive

      - name: Setup Linux toolchain
        uses: ./head/.github/actions/setup-linux-toolchain
        with:
          # valgrind counts the instructions, GNU time measures the peak memory usage of the executables
          extra-packages: valgrind time

      - name: Setup LLVM
        uses: ./head/.github/actions/setup-llvm
        with:
          cache-key-suffix: linux-x64
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      - name: Download Libs (head)
        # --tpde builds TPDE into the std, so that the TPDE benchmarks run
        working-directory: head
        run: python setup-deps.py --tpde

      - name: Download Libs (base)
        if: github.event_name == 'pull_request'
        working-directory: base
        run: python setup-deps.py --tpde

      - name: Build compiler (head)
        # With the stage0 compiler pinned in the checkout, so that a PR, that bumps the stage0 version, is measured correctly
        working-directory: head
        run: |
          python fetch-stage0.py
          python build.py

      - name: Build compiler (base)
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          python fetch-stage0.py
          python build.py

      - name: Run benchmarks
        if: github.event_name == 'pull_request'
        run: >-
          python head/benchmark/run-benchmarks.py run --suite pr
          --compiler base=base/build/spice --compiler head=head/build/spice --output results/results.json

      - name: Compare results
        if: github.event_name == 'pull_request'
        id: compare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-ok') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exits with 1, if a gated measure regressed. The report is only written, if the comparison succeeded
          set +e
          python head/benchmark/run-benchmarks.py compare results/results.json --baseline base --candidate head \
            --markdown results/report.md
          exit_code=$?
          set -e
          if [ ! -f results/report.md ]; then
            exit 1
          fi
          regressed=false
          if [ "$exit_code" -ne 0 ]; then
            regressed=true
          fi
          echo "regressed=$regressed" >> "$GITHUB_OUTPUT"

          # Body of the PR comment
          {
            cat results/report.md
            if [ "$regressed" = "true" ] && [ "$LABELED" = "true" ]; then
              echo "⚠️ Gated measures regressed. The regression is accepted by the label \`perf-regression-ok\`."
            elif [ "$regressed" = "true" ]; then
              echo "❌ The check fails, because gated measures regressed beyond their thresholds. If the regression is" \
                "intended, add the label \`perf-regression-ok\`."
            fi
            echo ""
            echo "<sub>Measured on a shared GitHub-hosted runner, so the times are only indicative. [Workflow run]($RUN_URL)</sub>"
          } > results/comment.md
          echo "$PR_NUMBER" > results/pr-number

      - name: Run A/A noise measurement
        if: github.event_name == 'workflow_dispatch'
        env:
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          mkdir -p results
          python head/benchmark/run-benchmarks.py noise --compiler head/build/spice --repetitions "$REPETITIONS" \
            --output results/noise.json > results/report.md

      - name: Write job summary
        if: ${{ !cancelled() && hashFiles('results/report.md') != '' }}
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ !cancelled() && hashFiles('results/report.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          # benchmark-comment.yml downloads the artifact by this name
          name: benchmark-report
          path: results/
          retention-days: 30

      - name: Check for regressions
        if: github.event_name == 'pull_request'
        env:
          REGRESSED: ${{ steps.compare.outputs.regressed }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-regression-ok') }}
        run: |
          if [ "$REGRESSED" = "true" ] && [ "$LABELED" != "true" ]; then
            echo "::error::Gated measures regressed beyond their thresholds, see the job summary. If the regression is" \
              "intended, add the label 'perf-regression-ok'."
            exit 1
          fi
