name: Release

on:
  push:
    tags:
      - '*'

env:
  LLVM_VERSION: "llvmorg-23.1.3"
  GCC_VERSION: "16"

jobs:
  build-compiler-linux-x86:
    name: Build compiler - Linux/x86_64
    runs-on: ubuntu-26.04
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          # clang compiles TPDE's encoding templates (deps/tpde/tpde-llvm), the GCC toolchain builds everything else.
          # zlib, zstd and ncurses provide the static archives for linking the bootstrap compiler (see std/bindings/llvm).
          sudo apt-get install ninja-build uuid-dev zlib1g-dev libzstd-dev libncurses-dev checksec jq gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Build LLVM
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;Mips;NVPTX;PowerPC;RISCV;WebAssembly;X86" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build host compiler
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DSPICE_ALL_TARGETS=ON \
            -DSPICE_LINK_STATIC=ON \
            -DSPICE_LTO=ON \
            -DSPICE_ENABLE_TPDE=ON \
            -DSPICE_VERSION="${{ github.ref_name }}" \
            -DSPICE_GIT_HASH="${{ github.sha }}" \
            -DSPICE_BUILT_BY="ghactions" \
            ..
          cmake --build . --target spice

      - name: Process build output
        working-directory: build
        run: |
          mv ./src-host/spice spice-host
          chmod +x spice-host
          # The vendored libbacktrace that the 'spice' target built for this platform. Released packages ship it
          # inside the std, and it is per-platform, so it has to travel with this job's binary - the release runner
          # packages std/ from a plain checkout and cannot produce it.
          cp ../std/runtime/lib/libbacktrace.a libbacktrace.a
          # Its license, that setup-deps.py put into the std next to it, has to accompany the archive
          mkdir -p runtime && cp -r ../std/runtime/LICENSES runtime/
          # The TPDE static libraries and headers, that the std TPDE bindings (std/bindings/tpde) use. Released Linux
          # packages ship them inside the std as well, so they travel with this job's binary just like libbacktrace.
          mkdir -p tpde/lib tpde/include tpde/LICENSES
          cp deps/tpde/tpde-llvm/libtpde_llvm.a deps/tpde/tpde/libtpde.a deps/tpde/tpde/deps/fadec/libfadec.a \
            deps/tpde/tpde/deps/disarm/libdisarm64.a deps/tpde/tpde/deps/spdlog/libspdlog.a tpde/lib/
          cp -r ../deps/tpde/tpde-llvm/include/tpde-llvm tpde/include/
          # Their licenses must accompany the archives
          cp ../deps/tpde/LICENSES/Apache-2.0.txt tpde/LICENSES/tpde-Apache-2.0.txt
          cp ../deps/tpde/LICENSES/LLVM-exception.txt tpde/LICENSES/tpde-LLVM-exception.txt
          cp ../deps/tpde/deps/fadec/LICENSE tpde/LICENSES/fadec-LICENSE
          cp ../deps/tpde/deps/disarm/LICENSE tpde/LICENSES/disarm-LICENSE
          cp ../deps/tpde/deps/spdlog/LICENSE tpde/LICENSES/spdlog-LICENSE

      - name: Fetch stage0 compiler
        # The released self-hosted compiler, pinned in .github/stage0-version, that builds the bootstrap compiler, which is
        # released as 'spice'. The host compiler is only built to be released as 'spice-host'
        run: python fetch-stage0.py

      - name: Build bootstrap compiler
        working-directory: build
        env:
          SPICE_STD_DIR: ${{ github.workspace }}/std
          SPICE_BOOTSTRAP_DIR: ${{ github.workspace }}/src
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: |
          # Back the TPDE backend of the bootstrap compiler with the TPDE libraries, that were just built along with the host
          # compiler. The flags have the layout the compiler derives from a std that ships them (see getStdTPDEFlags).
          # In a static link, an archive only resolves references from objects before it, and the TPDE archives come
          # after the -lstdc++ of the LLVM bindings, so libstdc++ and libm go into the TPDE group as well.
          export TPDE_FLAGS="-I$PWD/tpde/include -Wl,--start-group $(printf '%s ' "$PWD"/tpde/lib/{libtpde_llvm,libtpde,libfadec,libdisarm64,libspdlog}.a)-lstdc++ -lm -Wl,--end-group"
          # Linked statically like the host compiler, so it runs without the libstdc++ of the GCC installed on this runner
          ./stage0/spice build -O3 -lto --static --ignore-cache \
            --build-var SPICE_VERSION="${{ github.ref_name }}" \
            --build-var SPICE_GIT_HASH="${{ github.sha }}" \
            --build-var SPICE_BUILT_BY="ghactions" \
            --build-var SPICE_TARGET_OS="linux" \
            --build-var SPICE_TARGET_ARCH="amd64" \
            --output spice \
            ../src/main.spice
          chmod +x spice
          ./spice --version

      - name: Run Checksec
        working-directory: build
        run: |
          checksec --file=./spice-host --output=json | jq
          checksec --file=./spice --output=json | jq

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spice-linux-x64
          path: |
            ./build/spice**
            ./build/libbacktrace.a
            ./build/runtime/**
            ./build/tpde/**

