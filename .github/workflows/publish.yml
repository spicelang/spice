name: Release

on:
  push:
    tags:
      - '*'

jobs:
  build-compiler-linux:
    name: Build compiler - ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read
    strategy:
      # The platforms are independent of each other, like separate jobs
      fail-fast: false
      matrix:
        include:
          - name: Linux/x86_64
            runs-on: ubuntu-26.04
            target-arch: amd64
            artifact: spice-linux-x64
          - name: Linux/AArch64
            runs-on: ubuntu-26.04-arm
            target-arch: aarch64
            artifact: spice-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Linux toolchain
        uses: ./.github/actions/setup-linux-toolchain
        with:
          # clang compiles TPDE's encoding templates (deps/tpde/tpde-llvm), the GCC toolchain builds everything else.
          # zlib, zstd and ncurses provide the static archives for linking the compiler (see std/bindings/llvm), libssl-dev the
          # OpenSSL archives for linking Spice Shaker (see std/bindings/openssl).
          packages: ninja-build uuid-dev zlib1g-dev libzstd-dev libncurses-dev libssl-dev pkg-config checksec jq clang
          # Neither the faster linker nor the ccache is used for release builds
          use-mold: "false"
          use-ccache: "false"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          # Release builds always build LLVM from scratch
          cache: "false"
          targets: AArch64;AMDGPU;ARM;Mips;NVPTX;PowerPC;RISCV;WebAssembly;X86
          use-ccache: "false"
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3 -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_PIC=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON

      - name: Download Libs
        # --tpde builds TPDE into the std, for the TPDE backend of the compiler and the std TPDE bindings. With the GCC
        # toolchain, since the compiler links the TPDE archives statically together with its libstdc++
        env:
          CC: gcc
          CXX: g++
        run: python setup-deps.py --tpde

      - name: Collect std libraries
        run: |
          mkdir -p build && cd build
          # The vendored libbacktrace that setup-deps.py built for this platform. Released packages ship it inside the std,
          # and it is per-platform, so it has to travel with this job's binary - the release runner packages std/ from a
          # plain checkout and cannot produce it.
          cp ../std/runtime/lib/libbacktrace.a libbacktrace.a
          # Its license, that setup-deps.py put into the std next to it, has to accompany the archive
          mkdir -p runtime && cp -r ../std/runtime/LICENSES runtime/
          # The TPDE static libraries, headers and licenses, that setup-deps.py put into the std for the std TPDE bindings
          # (std/bindings/tpde). Released Linux packages ship them inside the std as well, so they travel with this job's
          # binary just like libbacktrace.
          mkdir -p tpde && cp -r ../std/bindings/tpde/lib ../std/bindings/tpde/include ../std/bindings/tpde/LICENSES tpde/

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler, which is released as 'spice'
        run: python fetch-stage0.py

      - name: Build compiler
        working-directory: build
        env:
          SPICE_STD_DIR: ${{ github.workspace }}/std
          SPICE_BOOTSTRAP_DIR: ${{ github.workspace }}/src
        run: |
          # Back the TPDE backend of the compiler with the TPDE libraries, that setup-deps.py built. The flags have the layout
          # the compiler derives from a std that ships them (see getStdTPDEFlags).
          # In a static link, an archive only resolves references from objects before it, and the TPDE archives come
          # after the -lstdc++ of the LLVM bindings, so libstdc++ and libm go into the TPDE group as well.
          export TPDE_FLAGS="-I$PWD/tpde/include -Wl,--start-group $(printf '%s ' "$PWD"/tpde/lib/{libtpde_llvm,libtpde,libfadec,libdisarm64,libspdlog}.a)-lstdc++ -lm -Wl,--end-group"
          # Two-stage build for Full RELRO: the pinned stage0 compiler predates the RELRO linker flags, so what it links is
          # not hardened. The stage1 compiler built from this checkout links with '-z relro -z now' and builds the released
          # compiler. Stage1 lives outside the artifact upload globs.
          build_compiler() {
            # Linked statically, so it runs without the libstdc++ of the GCC installed on this runner
            "$1" build -O3 -lto --static --ignore-cache \
              --build-var SPICE_VERSION="${{ github.ref_name }}" \
              --build-var SPICE_GIT_HASH="${{ github.sha }}" \
              --build-var SPICE_BUILT_BY="ghactions" \
              --build-var SPICE_TARGET_OS="linux" \
              --build-var SPICE_TARGET_ARCH="${{ matrix.target-arch }}" \
              --output "$2" \
              ../src/main.spice
          }
          mkdir -p stage1
          build_compiler ./stage0/spice stage1/spice
          build_compiler ./stage1/spice spice
          chmod +x spice
          ./spice --version

      - name: Read Spice Shaker revision
        id: shaker
        run: echo "ref=$(cat .github/spice-shaker-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spice Shaker
        uses: actions/checkout@v7
        with:
          repository: spicelang/spice-shaker
          ref: ${{ steps.shaker.outputs.ref }}
          path: spice-shaker
          persist-credentials: false

      - name: Build Spice Shaker
        # The package manager, released next to the compiler as 'spice-shaker', at the revision pinned in
        # .github/spice-shaker-version. Built by the released compiler with the std of this checkout. It cannot install its own
        # dependencies before it is built, so its bootstrap script installs them from its lock file.
        working-directory: build
        env:
          SPICE_STD_DIR: ${{ github.workspace }}/std
        run: |
          python3 ../spice-shaker/bootstrap.py
          # Linked statically like the compiler, OpenSSL included. std/net/tls finds the CA certificates of distributions
          # that keep them elsewhere than this runner.
          ./spice build -O3 -lto --static --ignore-cache --output spice-shaker ../spice-shaker/src/main.spice
          chmod +x spice-shaker
          ./spice-shaker --version

      - name: Run Checksec
        working-directory: build
        run: |
          for binary in spice spice-shaker; do
            checksec --file=./$binary --output=json | tee checksec.json | jq
            # The release must be linked with Full RELRO
            jq -e 'to_entries[0].value.relro == "full"' checksec.json
            # ... and as a (static) PIE: ET_DYN instead of ET_EXEC
            readelf -h ./$binary | grep -E 'Type:\s+DYN'
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ./build/spice**
            ./build/libbacktrace.a
            ./build/runtime/**
            ./build/tpde/**

  build-compiler-windows-x86:
    name: Build compiler - Windows/x86_64
    runs-on: windows-2025-vs2026
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Windows toolchain
        uses: ./.github/actions/setup-windows-toolchain
        with:
          packages: ninja
          vcpkg-packages: ""
          use-ccache: "false"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          # Release builds always build LLVM from scratch
          cache: "false"
          targets: AArch64;AMDGPU;ARM;Mips;NVPTX;PowerPC;RISCV;WebAssembly;X86
          use-ccache: "false"
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      # libbacktrace (deps/libbacktrace) builds with autotools, so setup-deps.py below needs a POSIX shell and
      # make. MSYS2 supplies both; 'path-type: inherit' keeps the runner's own PATH, so configure picks up the very
      # gcc the compiler is built with and the archive matches its ABI. Windows only - every other runner has them.
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make
          path-type: inherit

      - name: Put MSYS2 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH

      - name: Download Libs
        run: python setup-deps.py

      - name: Collect std libraries
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cd build
          # The vendored libbacktrace that setup-deps.py built for this platform. Released packages ship it inside the std,
          # and it is per-platform, so it has to travel with this job's binary - the release runner packages std/ from a
          # plain checkout and cannot produce it.
          cp ../std/runtime/lib/libbacktrace.a libbacktrace.a
          # Its license, that setup-deps.py put into the std next to it, has to accompany the archive
          New-Item -ItemType Directory -Force runtime | Out-Null
          Copy-Item -Recurse ../std/runtime/LICENSES runtime/LICENSES

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler, which is released as 'spice'
        run: python fetch-stage0.py

      - name: Build compiler
        working-directory: build
        run: |
          # Forward slashes, like in the paths that the CI workflow hands to the compiler build
          $workspace = "${{ github.workspace }}" -replace '\\', '/'
          $env:SPICE_STD_DIR = "$workspace/std"
          $env:SPICE_BOOTSTRAP_DIR = "$workspace/src"
          # Linked statically, so it runs without the MinGW runtime DLLs
          ./stage0/spice.exe build -O3 -lto --static --ignore-cache `
            --build-var SPICE_VERSION="${{ github.ref_name }}" `
            --build-var SPICE_GIT_HASH="${{ github.sha }}" `
            --build-var SPICE_BUILT_BY="ghactions" `
            --build-var SPICE_TARGET_OS="windows" `
            --build-var SPICE_TARGET_ARCH="amd64" `
            --output spice.exe `
            ../src/main.spice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./spice.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spice-windows-static-x64
          path: |
            ./build/spice**
            ./build/libbacktrace.a
            ./build/runtime/**

  build-compiler-macos-aarch64:
    name: Build compiler - MacOS/AArch64
    runs-on: macos-26
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup macOS toolchain
        uses: ./.github/actions/setup-macos-toolchain
        with:
          # OpenSSL and pkg-config for Spice Shaker, that links Homebrew's OpenSSL (see std/bindings/openssl)
          packages: openssl@3 pkgconf
          use-ccache: "false"

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          # Release builds always build LLVM from scratch
          cache: "false"
          targets: AArch64;AMDGPU;ARM;Mips;NVPTX;PowerPC;RISCV;WebAssembly;X86
          use-ccache: "false"
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      - name: Download Libs
        run: python setup-deps.py

      - name: Collect std libraries
        run: |
          mkdir -p build && cd build
          # The vendored libbacktrace that setup-deps.py built for this platform. Released packages ship it inside the std,
          # and it is per-platform, so it has to travel with this job's binary - the release runner packages std/ from a
          # plain checkout and cannot produce it.
          cp ../std/runtime/lib/libbacktrace.a libbacktrace.a
          # Its license, that setup-deps.py put into the std next to it, has to accompany the archive
          mkdir -p runtime && cp -r ../std/runtime/LICENSES runtime/

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler, which is released as 'spice'
        run: python fetch-stage0.py

      - name: Build compiler
        working-directory: build
        env:
          SPICE_STD_DIR: ${{ github.workspace }}/std
          SPICE_BOOTSTRAP_DIR: ${{ github.workspace }}/src
        run: |
          # Linked dynamically, macOS does not support static executables
          ./stage0/spice build -O3 -lto --ignore-cache \
            --build-var SPICE_VERSION="${{ github.ref_name }}" \
            --build-var SPICE_GIT_HASH="${{ github.sha }}" \
            --build-var SPICE_BUILT_BY="ghactions" \
            --build-var SPICE_TARGET_OS="macos" \
            --build-var SPICE_TARGET_ARCH="aarch64" \
            --output spice \
            ../src/main.spice
          chmod +x spice
          ./spice --version
          # The shared libraries it needs at runtime
          otool -L spice

      - name: Read Spice Shaker revision
        id: shaker
        run: echo "ref=$(cat .github/spice-shaker-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout Spice Shaker
        uses: actions/checkout@v7
        with:
          repository: spicelang/spice-shaker
          ref: ${{ steps.shaker.outputs.ref }}
          path: spice-shaker
          persist-credentials: false

      - name: Build Spice Shaker
        # The package manager, released next to the compiler as 'spice-shaker', at the revision pinned in
        # .github/spice-shaker-version. Built by the released compiler with the std of this checkout. It cannot install its own
        # dependencies before it is built, so its bootstrap script installs them from its lock file.
        working-directory: build
        env:
          SPICE_STD_DIR: ${{ github.workspace }}/std
        run: |
          python3 ../spice-shaker/bootstrap.py
          # Linked dynamically against Homebrew's OpenSSL, which is keg-only and thus not on the default pkg-config path. The
          # Homebrew cask depends on it.
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./spice build -O3 -lto --ignore-cache --output spice-shaker ../spice-shaker/src/main.spice
          chmod +x spice-shaker
          ./spice-shaker --version
          otool -L spice-shaker

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spice-macos-arm64
          path: |
            ./build/spice**
            ./build/libbacktrace.a
            ./build/runtime/**

  build-artifacts:
    name: Build artifacts
    needs: [
      build-compiler-linux,
      build-compiler-windows-x86,
      build-compiler-macos-aarch64
    ]
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Docker login GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Docker login Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: chillibits
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      - name: Setup UPX
        # GoReleaser compresses the compiler binaries with UPX. The latest UPX release, not the distribution's (see the script)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install-upx.sh

      - name: Download all artifacts of compiler build
        uses: actions/download-artifact@v8
        with:
          path: bin

      - name: Rename compiler binaries & allow execution
        working-directory: bin
        run: |
          mv spice-windows-static-x64 spice-windows-amd64
          mv spice-linux-x64 spice-linux-amd64
          mv spice-macos-arm64 spice-darwin-arm64
          chmod -R +x ./
          # The TPDE libraries, headers and licenses of the Linux jobs and the libbacktrace licenses are data and go into the
          # std like the rest of it
          chmod -R a-x,a+X spice-linux-amd64/tpde spice-linux-arm64/tpde spice-*/runtime

      # Each compiler job uploaded the libbacktrace.a it built for its own platform, next to its binary. The
      # archives and the Linux packages pick theirs straight out of bin/ via a template, but the container image is
      # built for both Linux architectures in one go, so its two have to be laid out for $TARGETPLATFORM the way
      # the Dockerfile already selects the compiler binary.
      - name: Stage libbacktrace for the container build context
        run: |
          # Laid out like <std>/runtime, which the Dockerfile copies it over
          mkdir -p docker-libs/linux/amd64/lib docker-libs/linux/arm64/lib
          cp bin/spice-linux-amd64/libbacktrace.a docker-libs/linux/amd64/lib/libbacktrace.a
          cp bin/spice-linux-arm64/libbacktrace.a docker-libs/linux/arm64/lib/libbacktrace.a
          # Its BSD license requires the notice to accompany binary redistributions, so it goes in next to the archive.
          cp -r bin/spice-linux-amd64/runtime/LICENSES docker-libs/linux/amd64/LICENSES
          cp -r bin/spice-linux-arm64/runtime/LICENSES docker-libs/linux/arm64/LICENSES
          # A stale archive or license in the checkout would be packaged for every platform by the 'std' entry, next to
          # the platform-matched one. There is none on a clean runner; make sure of it.
          rm -rf std/runtime/lib std/runtime/LICENSES

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.CR_PAT }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-output
          path: dist/

  deploy-nexus:
    name: Deploy to Nexus
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: contains(github.ref, 'rc') == false
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download dist output
        uses: actions/download-artifact@v8
        with:
          name: dist-output

      - name: Deploy to Debian / Raspbian repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-trixie/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-bookworm/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-bullseye/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-buster/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-stretch/"

      - name: Deploy to Ubuntu repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-resolute/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-noble/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-jammy/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-focal/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-bionic/"

      - name: Deploy to CentOS repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --upload-file ./spice_${{ matrix.arch }}.rpm ${{ secrets.NEXUS_URL }}/centos/spice/${{ github.ref_name }}/spice-${{ matrix.arch }}.rpm

      - name: Deploy to Fedora repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --upload-file ./spice_${{ matrix.arch }}.rpm ${{ secrets.NEXUS_URL }}/fedora/spice/${{ github.ref_name }}/spice-${{ matrix.arch }}.rpm

  #     - name: Deploy to Alpine repo
  #       run: |
  #         curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.apk" "${{ secrets.NEXUS_URL }}/alpine/spice/${{ github.ref_name }}/spice-${{ matrix.arch }}.apk"

  build-win-installers:
    name: Build Windows installers
    needs: build-artifacts
    runs-on: windows-latest
    strategy:
      matrix:
        config:
          - { arch: amd64, label: x64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GoMSI
        run: choco install -y go-msi

      - name: Download executables
        id: download_exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF#refs/tags/}" -p *windows_${{ matrix.config.arch }}*.zip
          printf "::set-output name=zip::%s\n" *.zip
          unzip -o *.zip && rm -v *.zip
          dir

      - name: Prepare PATH
        shell: bash
        run: |
          echo "$WIX\\bin" >> $GITHUB_PATH
          echo "C:\\Program Files\\go-msi" >> $GITHUB_PATH

      - name: Build MSI
        shell: bash
        id: build_msi
        env:
          ZIP_FILE: ${{ steps.download_exe.outputs.zip }}
        run: |
          mkdir -p build
          msi="$(basename "$ZIP_FILE" ".zip").msi"
          printf "::set-output name=msi::%s\n" "$msi"
          go-msi make --msi "$PWD/$msi" --src "$PWD/tools/wix" --out "$PWD/build" --version ${{ github.ref_name }}
          printf "::set-output name=msi::%s\n" *.msi

      - name: Upload MSI
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build_msi.outputs.msi }}
          asset_name: spice_${{ matrix.config.label }}_setup.msi
          tag: ${{ github.ref }}

  deploy-winget:
    name: Deploy to WinGet
    needs: build-win-installers
    runs-on: ubuntu-latest
    # Release candidates would become the newest version of the package for every WinGet user
    if: contains(github.ref, 'rc') == false
    # Komac only reads the release from GitHub and submits the manifest PR with the token, the checkout needs no more
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Komac
        run: bash .github/scripts/install-komac.sh

      # Komac downloads the installer to fill in its hash, product code and so on, and opens the PR against
      # microsoft/winget-pkgs from a fork of the token owner. It needs a classic token with the 'public_repo' scope,
      # fine-grained tokens cannot open the PR.
      - name: Submit manifest to winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.CR_PAT }}
          VERSION: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          komac update ChilliBits.Spice \
            --version "$VERSION" \
            --urls "$REPO_URL/releases/download/$VERSION/spice_x64_setup.msi" \
            --release-notes-url "$REPO_URL/releases/tag/$VERSION" \
            --submit
