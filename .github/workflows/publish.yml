  build-compiler-windows-x86:
    name: Build compiler - Windows/x86_64
    runs-on: windows-2025-vs2026
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Dependencies
        run: |
          choco install ninja -y

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Build LLVM
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" `
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;Mips;NVPTX;PowerPC;RISCV;WebAssembly;X86" `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            ../llvm
          cmake --build .

      # libbacktrace (deps/libbacktrace) builds with autotools, so setup-deps.py below needs a POSIX shell and
      # make. MSYS2 supplies both; 'path-type: inherit' keeps the runner's own PATH, so configure picks up the very
      # gcc the compiler is built with and the archive matches its ABI. Windows only - every other runner has them.
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make
          path-type: inherit

      - name: Put MSYS2 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH

      - name: Download Libs
        run: python setup-deps.py

      - name: Build host compiler
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
          CMAKE_TLS_VERIFY: "1"
          SSL_CERT_FILE: "C:\\cacert.pem"
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DSPICE_ALL_TARGETS=ON `
            -DSPICE_LINK_STATIC=ON `
            -DSPICE_VERSION="${{ github.ref_name }}" `
            -DSPICE_GIT_HASH="${{ github.sha }}" `
            -DSPICE_BUILT_BY="ghactions" `
            ..
          cmake --build . --target spice

      - name: Process build output
        working-directory: build
        run: |
          mv ./src-host/spice.exe spice-host.exe
          # The vendored libbacktrace that the 'spice' target built for this platform. Released packages ship it
          # inside the std, and it is per-platform, so it has to travel with this job's binary - the release runner
          # packages std/ from a plain checkout and cannot produce it.
          cp ../std/runtime/lib/libbacktrace.a libbacktrace.a
          # Its license, that setup-deps.py put into the std next to it, has to accompany the archive
          New-Item -ItemType Directory -Force runtime | Out-Null
          Copy-Item -Recurse ../std/runtime/LICENSES runtime/LICENSES

      - name: Fetch stage0 compiler
        # The released self-hosted compiler, pinned in .github/stage0-version, that builds the bootstrap compiler, which is
        # released as 'spice'. The host compiler is only built to be released as 'spice-host'
        run: python fetch-stage0.py

      - name: Build bootstrap compiler
        working-directory: build
        run: |
          # Forward slashes, like CMake hands these paths to the bootstrap compiler build in the CI workflow
          $workspace = "${{ github.workspace }}" -replace '\\', '/'
          $env:SPICE_STD_DIR = "$workspace/std"
          $env:SPICE_BOOTSTRAP_DIR = "$workspace/src"
          $env:LLVM_LIB_DIR = "$workspace/llvm/build/lib"
          $env:LLVM_INCLUDE_DIRS = "-I$workspace/llvm/llvm/include -I$workspace/llvm/build/include"
          # Linked statically like the host compiler, so it runs without the MinGW runtime DLLs
          ./stage0/spice.exe build -O3 -lto --static --ignore-cache `
            --build-var SPICE_VERSION="${{ github.ref_name }}" `
            --build-var SPICE_GIT_HASH="${{ github.sha }}" `
            --build-var SPICE_BUILT_BY="ghactions" `
            --build-var SPICE_TARGET_OS="windows" `
            --build-var SPICE_TARGET_ARCH="amd64" `
            --output spice.exe `
            ../src/main.spice
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./spice.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spice-windows-static-x64
          path: |
            ./build/spice**
            ./build/libbacktrace.a
            ./build/runtime/**

  build-compiler-macos-aarch64:
    name: Build compiler - MacOS/AArch64
    runs-on: macos-26
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Build LLVM
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;AMDGPU;ARM;Mips;NVPTX;PowerPC;RISCV;WebAssembly;X86" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build host compiler
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DSPICE_ALL_TARGETS=ON \
            -DSPICE_LTO=ON \
            -DSPICE_VERSION="${{ github.ref_name }}" \
            -DSPICE_GIT_HASH="${{ github.sha }}" \
            -DSPICE_BUILT_BY="ghactions" \
            ..
          cmake --build . --target spice

      - name: Process build output
        working-directory: build
        run: |
          mv ./src-host/spice spice-host
          chmod +x spice-host
          # The vendored libbacktrace that the 'spice' target built for this platform. Released packages ship it
          # inside the std, and it is per-platform, so it has to travel with this job's binary - the release runner
          # packages std/ from a plain checkout and cannot produce it.
          cp ../std/runtime/lib/libbacktrace.a libbacktrace.a
          # Its license, that setup-deps.py put into the std next to it, has to accompany the archive
          mkdir -p runtime && cp -r ../std/runtime/LICENSES runtime/

      - name: Fetch stage0 compiler
        # The released self-hosted compiler, pinned in .github/stage0-version, that builds the bootstrap compiler, which is
        # released as 'spice'. The host compiler is only built to be released as 'spice-host'
        run: python fetch-stage0.py

      - name: Build bootstrap compiler
        working-directory: build
        env:
          SPICE_STD_DIR: ${{ github.workspace }}/std
          SPICE_BOOTSTRAP_DIR: ${{ github.workspace }}/src
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: |
          # Linked dynamically like the host compiler, macOS does not support static executables
          ./stage0/spice build -O3 -lto --ignore-cache \
            --build-var SPICE_VERSION="${{ github.ref_name }}" \
            --build-var SPICE_GIT_HASH="${{ github.sha }}" \
            --build-var SPICE_BUILT_BY="ghactions" \
            --build-var SPICE_TARGET_OS="macos" \
            --build-var SPICE_TARGET_ARCH="aarch64" \
            --output spice \
            ../src/main.spice
          chmod +x spice
          ./spice --version
          # The shared libraries it needs at runtime
          otool -L spice

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spice-macos-arm64
          path: |
            ./build/spice**
            ./build/libbacktrace.a
            ./build/runtime/**

  build-artifacts:
    name: Build artifacts
    needs: [
      build-compiler-linux-x86,
      build-compiler-linux-aarch64,
      build-compiler-windows-x86,
      build-compiler-macos-aarch64
    ]
    runs-on: ubuntu-latest
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      - name: Docker login GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Docker login Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: chillibits
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      - name: Setup UPX
        run: |
          sudo apt-get update
          sudo apt-get install upx

      - name: Download all artifacts of compiler build
        uses: actions/download-artifact@v8
        with:
          path: bin

      - name: Rename compiler binaries & allow execution
        working-directory: bin
        run: |
          mv spice-windows-static-x64 spice-windows-amd64
          mv spice-linux-x64 spice-linux-amd64
          mv spice-macos-arm64 spice-darwin-arm64
          chmod -R +x ./
          # The TPDE libraries, headers and licenses of the Linux jobs and the libbacktrace licenses are data and go into the
          # std like the rest of it
          chmod -R a-x,a+X spice-linux-amd64/tpde spice-linux-arm64/tpde spice-*/runtime

      # Each compiler job uploaded the libbacktrace.a it built for its own platform, next to its binary. The
      # archives and the Linux packages pick theirs straight out of bin/ via a template, but the container image is
      # built for both Linux architectures in one go, so its two have to be laid out for $TARGETPLATFORM the way
      # the Dockerfile already selects the compiler binary.
      - name: Stage libbacktrace for the container build context
        run: |
          # Laid out like <std>/runtime, which the Dockerfile copies it over
          mkdir -p docker-libs/linux/amd64/lib docker-libs/linux/arm64/lib
          cp bin/spice-linux-amd64/libbacktrace.a docker-libs/linux/amd64/lib/libbacktrace.a
          cp bin/spice-linux-arm64/libbacktrace.a docker-libs/linux/arm64/lib/libbacktrace.a
          # Its BSD license requires the notice to accompany binary redistributions, so it goes in next to the archive.
          cp -r bin/spice-linux-amd64/runtime/LICENSES docker-libs/linux/amd64/LICENSES
          cp -r bin/spice-linux-arm64/runtime/LICENSES docker-libs/linux/arm64/LICENSES
          # A stale archive or license in the checkout would be packaged for every platform by the 'std' entry, next to
          # the platform-matched one. There is none on a clean runner; make sure of it.
          rm -rf std/runtime/lib std/runtime/LICENSES

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.CR_PAT }}
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-output
          path: dist/

  deploy-nexus:
    name: Deploy to Nexus
    needs: build-artifacts
    runs-on: ubuntu-latest
    if: contains(github.ref, 'rc') == false
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Download dist output
        uses: actions/download-artifact@v8
        with:
          name: dist-output

      - name: Deploy to Debian / Raspbian repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-trixie/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-bookworm/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-bullseye/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-buster/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/debian-stretch/"

      - name: Deploy to Ubuntu repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-resolute/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-noble/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-jammy/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-focal/"
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.deb" "${{ secrets.NEXUS_URL }}/ubuntu-bionic/"

      - name: Deploy to CentOS repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --upload-file ./spice_${{ matrix.arch }}.rpm ${{ secrets.NEXUS_URL }}/centos/spice/${{ github.ref_name }}/spice-${{ matrix.arch }}.rpm

      - name: Deploy to Fedora repo
        run: |
          curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --upload-file ./spice_${{ matrix.arch }}.rpm ${{ secrets.NEXUS_URL }}/fedora/spice/${{ github.ref_name }}/spice-${{ matrix.arch }}.rpm

  #     - name: Deploy to Alpine repo
  #       run: |
  #         curl -sSf -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" -H "Content-Type: multipart/form-data" --data-binary "@./spice_${{ matrix.arch }}.apk" "${{ secrets.NEXUS_URL }}/alpine/spice/${{ github.ref_name }}/spice-${{ matrix.arch }}.apk"

  build-win-installers:
    name: Build Windows installers
    needs: build-artifacts
    runs-on: windows-latest
    strategy:
      matrix:
        config:
          - { arch: amd64, label: x64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install GoMSI
        run: choco install -y go-msi

      - name: Download executables
        id: download_exe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF#refs/tags/}" -p *windows_${{ matrix.config.arch }}*.zip
          printf "::set-output name=zip::%s\n" *.zip
          unzip -o *.zip && rm -v *.zip
          dir

      - name: Prepare PATH
        shell: bash
        run: |
          echo "$WIX\\bin" >> $GITHUB_PATH
          echo "C:\\Program Files\\go-msi" >> $GITHUB_PATH

      - name: Copy DLLs to source dir
        shell: bash
        env:
          ZIP_FILE: ${{ steps.download_exe.outputs.zip }}
        run: cp ./src-host/thirdparty/zlib1__.dll ./

      - name: Build MSI
        shell: bash
        id: build_msi
        env:
          ZIP_FILE: ${{ steps.download_exe.outputs.zip }}
        run: |
          mkdir -p build
          msi="$(basename "$ZIP_FILE" ".zip").msi"
          printf "::set-output name=msi::%s\n" "$msi"
          go-msi make --msi "$PWD/$msi" --out "$PWD/build" --version ${{ github.ref_name }}
          printf "::set-output name=msi::%s\n" *.msi

      - name: Upload MSI
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build_msi.outputs.msi }}
          asset_name: spice_${{ matrix.config.label }}_setup.msi
          tag: ${{ github.ref }}

      - name: Deploy to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: ChilliBits.Spice
          version: ${{ github.ref_name }}
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.CR_PAT }}
