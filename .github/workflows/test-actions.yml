# TEMPORARY: verifies the inputs of the Windows and macOS toolchain actions that the CI jobs do not use. Removed before the merge.
name: Test actions (temporary)

on:
  push:
    branches:
      - ci/composite-windows-macos
    paths:
      - .github/workflows/test-actions.yml
      - .github/actions/**

jobs:
  windows:
    name: Windows, ${{ matrix.variant }}
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [release, ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Windows toolchain (release inputs)
        if: matrix.variant == 'release'
        id: toolchain-release
        uses: ./.github/actions/setup-windows-toolchain
        with:
          packages: ninja
          vcpkg-packages: ""
          use-ccache: "false"

      - name: Setup Windows toolchain (CI inputs)
        if: matrix.variant == 'ci'
        id: toolchain-ci
        uses: ./.github/actions/setup-windows-toolchain

      - name: Check the release variant
        if: matrix.variant == 'release'
        shell: bash
        run: |
          command -v ninja
          if case "${LIBRARY_PATH:-}" in *vcpkg*|*installed*) true ;; *) false ;; esac; then echo "vcpkg libs on LIBRARY_PATH: $LIBRARY_PATH"; exit 1; fi
          if [ -d "$LOCALAPPDATA/ccache" ]; then echo "ccache dir exists"; exit 1; fi
          test -z "${{ steps.toolchain-release.outputs.ccache-key }}"

      - name: Check the CI variant
        if: matrix.variant == 'ci'
        shell: bash
        run: |
          command -v ninja; command -v ccache; command -v dot
          echo "LIBRARY_PATH=$LIBRARY_PATH"
          case "$LIBRARY_PATH" in *installed*x64-windows*lib*) ;; *) echo "vcpkg lib dir missing on LIBRARY_PATH"; exit 1 ;; esac
          ls "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | grep -i sqlite
          test -d "$LOCALAPPDATA/ccache"
          test "${{ steps.toolchain-ci.outputs.ccache-key }}" = "ccache-Windows-X64-${{ github.sha }}"

  macos:
    name: MacOS, ${{ matrix.variant }}
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [release, ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup macOS toolchain (release inputs)
        if: matrix.variant == 'release'
        id: toolchain-release
        uses: ./.github/actions/setup-macos-toolchain
        with:
          packages: ""
          use-ccache: "false"

      - name: Setup macOS toolchain (CI inputs)
        if: matrix.variant == 'ci'
        id: toolchain-ci
        uses: ./.github/actions/setup-macos-toolchain

      - name: Check the release variant
        if: matrix.variant == 'release'
        run: |
          if [ -d ~/Library/Caches/ccache ]; then echo "ccache dir exists"; exit 1; fi
          if [ -n "${PKG_CONFIG_PATH:-}" ]; then echo "PKG_CONFIG_PATH is set: $PKG_CONFIG_PATH"; fi
          test -z "${{ steps.toolchain-release.outputs.ccache-key }}"

      - name: Check the CI variant
        if: matrix.variant == 'ci'
        run: |
          command -v ccache; command -v dot
          test -d ~/Library/Caches/ccache
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          case "$PKG_CONFIG_PATH" in *sqlite*pkgconfig*) ;; *) echo "sqlite pkg-config dir missing"; exit 1 ;; esac
          test "${{ steps.toolchain-ci.outputs.ccache-key }}" = "ccache-macOS-ARM64-${{ github.sha }}"
