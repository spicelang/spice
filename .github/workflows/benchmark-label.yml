name: Benchmark label

# Re-runs the job 'Benchmark gate' of the latest Benchmark run of a PR, when the label 'perf-regression-ok' is added or
# removed. The gate reads the current labels, so only the gate has to run again, not the benchmarks. pull_request_target,
# because the token of a pull_request run from a fork cannot re-run jobs. The workflow never checks out or runs code of
# the PR.

on:
  pull_request_target:
    types: [labeled, unlabeled]

jobs:
  rerun-gate:
    name: Re-run benchmark gate
    if: github.event.label.name == 'perf-regression-ok'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    steps:
      - name: Re-run the gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run="$(gh run list --repo "$REPO" --workflow benchmark.yml --event pull_request --commit "$HEAD_SHA" --limit 1 \
            --json databaseId,status --jq '.[0] // empty | "\(.databaseId) \(.status)"')"
          if [ -z "$run" ]; then
            echo "::notice::No Benchmark run of $HEAD_SHA"
            exit 0
          fi
          read -r run_id status <<< "$run"
          # Jobs of a run, that is still in progress, cannot be re-run. Its gate reads the labels, once it runs
          if [ "$status" != "completed" ]; then
            echo "::notice::The Benchmark run $run_id is $status, its gate reads the current labels"
            exit 0
          fi
          job_id="$(gh run view "$run_id" --repo "$REPO" --json jobs --jq '.jobs[] | select(.name == "Benchmark gate") | .databaseId')"
          if [ -z "$job_id" ]; then
            echo "::notice::The Benchmark run $run_id has no gate job"
            exit 0
          fi
          gh run rerun "$run_id" --repo "$REPO" --job "$job_id"
          echo "Re-running the gate of the Benchmark run $run_id"
