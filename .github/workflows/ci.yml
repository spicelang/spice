          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-aarch64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        # --tpde builds TPDE into the std, for the TPDE backend of the bootstrap compiler and the std TPDE bindings
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: python setup-deps.py --tpde

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_ENABLE_TPDE=ON \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Fetch stage0 compiler
        # The released self-hosted compiler, pinned in .github/stage0-version, that builds the bootstrap compiler
        run: python fetch-stage0.py

      - name: Run Test target (bootstrap compiler)
        # Builds the bootstrap compiler with the stage0 compiler, then runs all test cases against it. Test cases that check
        # outputs, where both compilers differ (e.g. ANTLR error messages or typeid values, since the bootstrap type hash
        # differs from the host's std::hash<Type>), follow the bootstrap compiler and have a 'skip-host' marker file. Test
        # cases, where the bootstrap compiler deliberately differs from the host, have bootstrap refs instead (e.g.
        # ir-code-bootstrap.ll for the debug info, since the LLVM C API can't express everything the host emits).
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python test/run-tests.py --build-compiler build/stage0/spice --is-github-actions

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --stage0-compiler build/stage0/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-linux-aarch64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-windows-x86:
    name: Windows/x86_64
    runs-on: windows-2025-vs2026
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      # Git for Windows checks out symlinks as plain text files by default. Some test cases need real symlinks
      - name: Enable symlinks
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Dependencies
        run: |
          choco install graphviz ccache ninja -y
          echo "C:\Program Files\Graphviz\bin" >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\ccache"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          # The compiler links via clang's GNU driver (--target=x86_64-w64-windows-gnu, MinGW), which reads
          # LIBRARY_PATH for '-l' search dirs, not the MSVC-only LIB variable.
          echo "LIBRARY_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIBRARY_PATH" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-win-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" `
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            ../llvm
          cmake --build .

      # libbacktrace (deps/libbacktrace) builds with autotools, so setup-deps.py below needs a POSIX shell and
      # make. MSYS2 supplies both; 'path-type: inherit' keeps the runner's own PATH, so configure picks up the very
      # gcc the compiler is built with and the archive matches its ABI. Windows only - every other runner has them.
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make
          path-type: inherit

      - name: Put MSYS2 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
          CMAKE_TLS_VERIFY: "1"
          SSL_CERT_FILE: "C:\\cacert.pem"
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DSPICE_BUILT_BY="ghactions" `
            -DSPICE_TEST_ARGS=--is-github-actions `
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: |
          cmake --build . --target spicetest_parallel

      - name: Fetch stage0 compiler
        # The released self-hosted compiler, pinned in .github/stage0-version, that builds the bootstrap compiler
        run: python fetch-stage0.py

      - name: Run Test target (bootstrap compiler)
        # Builds the bootstrap compiler with the stage0 compiler, then runs all test cases against it. Test cases that check
        # outputs, where both compilers differ (e.g. ANTLR error messages or typeid values, since the bootstrap type hash
        # differs from the host's std::hash<Type>), follow the bootstrap compiler and have a 'skip-host' marker file. Test
        # cases, where the bootstrap compiler deliberately differs from the host, have bootstrap refs instead (e.g.
        # ir-code-bootstrap.ll for the debug info, since the LLVM C API can't express everything the host emits).
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python test/run-tests.py --build-compiler build/stage0/spice.exe --is-github-actions

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --stage0-compiler build/stage0/spice.exe

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-win-x64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-macos-aarch64:
    name: MacOS/AArch64
    runs-on: macos-26
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Setup Dependencies
        run: |
          brew update
          # zstd: the stage0 compiler loads Homebrew's libzstd
          brew install ccache graphviz sqlite zstd
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          mkdir -p ~/Library/Caches/ccache

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-macos-aarch64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Fetch stage0 compiler
        # The released self-hosted compiler, pinned in .github/stage0-version, that builds the bootstrap compiler
        run: python fetch-stage0.py

      - name: Run Test target (bootstrap compiler)
        # Builds the bootstrap compiler with the stage0 compiler, then runs all test cases against it. Test cases that check
        # outputs, where both compilers differ (e.g. ANTLR error messages or typeid values, since the bootstrap type hash
        # differs from the host's std::hash<Type>), follow the bootstrap compiler and have a 'skip-host' marker file. Test
        # cases, where the bootstrap compiler deliberately differs from the host, have bootstrap refs instead (e.g.
        # ir-code-bootstrap.ll for the debug info, since the LLVM C API can't express everything the host emits).
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python test/run-tests.py --build-compiler build/stage0/spice --is-github-actions

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --stage0-compiler build/stage0/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-macos-aarch64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
