name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - '**.md'

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read
    strategy:
      # The platforms are independent of each other, like separate jobs
      fail-fast: false
      matrix:
        include:
          - name: Linux/x86_64
            runs-on: ubuntu-26.04
            platform: linux-x64
          - name: Linux/AArch64
            runs-on: ubuntu-26.04-arm
            platform: linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Linux toolchain
        id: toolchain
        uses: ./.github/actions/setup-linux-toolchain

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          cache-key-suffix: ${{ matrix.platform }}
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      - name: Download Libs
        # --tpde builds TPDE into the std, for the TPDE backend of the compiler and the std TPDE bindings
        run: python setup-deps.py --tpde

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler from src/
        run: python fetch-stage0.py

      - name: Run Test target
        # Builds the compiler with the stage0 compiler, then runs all test cases against it
        run: python test/run-tests.py --build-compiler build/stage0/spice --is-github-actions

      - name: Bootstrap until fixed point
        run: python bootstrap.py --stage0-compiler build/stage0/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-${{ matrix.platform }}
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.toolchain.outputs.ccache-key }}

  build-windows-x86:
    name: Windows/x86_64
    runs-on: windows-2025-vs2026
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      # Git for Windows checks out symlinks as plain text files by default. Some test cases need real symlinks
      - name: Enable symlinks
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Dependencies
        run: |
          choco install graphviz ccache ninja -y
          echo "C:\Program Files\Graphviz\bin" >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\ccache"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          # The compiler links via clang's GNU driver (--target=x86_64-w64-windows-gnu, MinGW), which reads
          # LIBRARY_PATH for '-l' search dirs, not the MSVC-only LIB variable.
          echo "LIBRARY_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIBRARY_PATH" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          cache-key-suffix: win-x64
          extra-cmake-args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS_RELEASE=-O3

      # libbacktrace (deps/libbacktrace) builds with autotools, so setup-deps.py below needs a POSIX shell and
      # make. MSYS2 supplies both; 'path-type: inherit' keeps the runner's own PATH, so configure picks up the very
      # gcc the compiler is built with and the archive matches its ABI. Windows only - every other runner has them.
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make
          path-type: inherit

      - name: Put MSYS2 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH

      - name: Download Libs
        run: python setup-deps.py

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler from src/
        run: python fetch-stage0.py

      - name: Run Test target
        # Builds the compiler with the stage0 compiler, then runs all test cases against it
        run: python test/run-tests.py --build-compiler build/stage0/spice.exe --is-github-actions

      - name: Bootstrap until fixed point
        run: python bootstrap.py --stage0-compiler build/stage0/spice.exe

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-win-x64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-macos-aarch64:
    name: MacOS/AArch64
    runs-on: macos-26
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Setup Dependencies
        run: |
          brew update
          # zstd: the stage0 compiler loads Homebrew's libzstd
          brew install ccache graphviz sqlite zstd
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          mkdir -p ~/Library/Caches/ccache

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm
        with:
          cache-key-suffix: macos-aarch64

      - name: Download Libs
        run: python setup-deps.py

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler from src/
        run: python fetch-stage0.py

      - name: Run Test target
        # Builds the compiler with the stage0 compiler, then runs all test cases against it
        run: python test/run-tests.py --build-compiler build/stage0/spice --is-github-actions

      - name: Bootstrap until fixed point
        run: python bootstrap.py --stage0-compiler build/stage0/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-macos-aarch64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
