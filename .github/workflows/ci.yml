name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'media/**'
      - '**.md'

env:
  LLVM_VERSION: "llvmorg-23.1.3"
  GCC_VERSION: "16"
  # Test filter for the bootstrap compiler runs: only the stages the bootstrap compiler already covers. Exclude known
  # bootstrap compiler gaps here (e.g. -TestSuite.testCase:TestSuite.otherTestCase) and remove them once fixed. Test cases
  # that check host specifics, the bootstrap compiler does not replicate (e.g. ANTLR error messages), have a
  # 'skip-bootstrap' marker file instead. Test cases that check typeid values (the bootstrap type hash differs from the
  # host's std::hash<Type>) follow the bootstrap compiler and have a 'skip-host' marker file.
  # Known gaps:
  # - debug info: the LLVM C API can't express everything the host emits (e.g. DIStringType, nameTableKind)
  # - testing_successTestingMultiFile: the bootstrap test main runs the tests of the source files in a different order
  # - data_containerScopeCleanupLeak: AddressSanitizer reports a stack-use-after-scope in code built by the bootstrap
  # - warnings_warningUnusedMethod: the bootstrap symbol table is an UnorderedMap, the host one a std::map sorted by name,
  #   so the warnings come in a different order
  BOOTSTRAP_TEST_FILTER: >-
    CommonTests.*:LexerTests.*:ParserTests.*:SymbolTableBuilderTests.*:TypeCheckerTests.*:IRGeneratorTests.*:StdTests.*:
    BenchmarkTests.*:ExampleTests.*
    -IRGeneratorTests.instrumentation_successTysanAndDbgInfo:
    IRGeneratorTests.instrumentation_successDbgInfoComplex:
    IRGeneratorTests.instrumentation_successDbgInfoLineOnly:
    IRGeneratorTests.instrumentation_successDbgInfoSimple:
    IRGeneratorTests.instrumentation_successAsanAndDbgInfo:
    IRGeneratorTests.instrumentation_successMsanAndDbgInfo:
    IRGeneratorTests.instrumentation_successTsanAndDbgInfo:
    IRGeneratorTests.testing_successTestingMultiFile:
    StdTests.data_containerScopeCleanupLeak:
    TypeCheckerTests.warnings_warningUnusedMethod
  # Additional bootstrap compiler gaps that only show up on Windows (appended to the negative patterns above):
  # - generics_successGenericTypeCtorCall1: the bootstrap compiler crashes with a heap corruption (0xC0000374)
  # - lto_successLtoSimple: the bootstrap compiler links the LTO modules in a different order
  # - runtime_resultErrTracePanic: the relative path to the std file in the panic message has one '../' less
  BOOTSTRAP_TEST_FILTER_WINDOWS: >-
    IRGeneratorTests.generics_successGenericTypeCtorCall1:
    IRGeneratorTests.lto_successLtoSimple:
    StdTests.runtime_resultErrTracePanic

jobs:
  build-linux-x86:
    name: Linux/x86_64
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install ccache ninja-build graphviz uuid-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          mkdir -p ~/.cache/ccache

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_ENABLE_TPDE=ON \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Run Test target (bootstrap compiler)
        working-directory: build
        shell: bash
        # The folded BOOTSTRAP_TEST_FILTER above is joined with spaces, which gtest does not accept
        run: GTEST_FILTER="${BOOTSTRAP_TEST_FILTER// /}" cmake --build . --target spicetest_bootstrap_parallel

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --host-compiler build/src/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-linux-x64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-linux-aarch64:
    name: Linux/AArch64
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install ccache ninja-build graphviz uuid-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          mkdir -p ~/.cache/ccache

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-aarch64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_ENABLE_TPDE=ON \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Run Test target (bootstrap compiler)
        working-directory: build
        shell: bash
        # The folded BOOTSTRAP_TEST_FILTER above is joined with spaces, which gtest does not accept
        run: GTEST_FILTER="${BOOTSTRAP_TEST_FILTER// /}" cmake --build . --target spicetest_bootstrap_parallel

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --host-compiler build/src/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-linux-aarch64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-windows-x86:
    name: Windows/x86_64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          choco install graphviz ccache ninja -y
          echo "C:\Program Files\Graphviz\bin" >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\ccache"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          # The compiler links via clang's GNU driver (--target=x86_64-w64-windows-gnu, MinGW), which reads
          # LIBRARY_PATH for '-l' search dirs, not the MSVC-only LIB variable.
          echo "LIBRARY_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\lib;$env:LIBRARY_PATH" >> $env:GITHUB_ENV
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-win-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" `
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" `
            -DLLVM_BUILD_TOOLS=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            ../llvm
          cmake --build .

      # libbacktrace (deps/libbacktrace) builds with autotools, so setup-deps.py below needs a POSIX shell and
      # make. MSYS2 supplies both; 'path-type: inherit' keeps the runner's own PATH, so configure picks up the very
      # gcc the compiler is built with and the archive matches its ABI. Windows only - every other runner has them.
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make
          path-type: inherit

      - name: Put MSYS2 on PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
          CMAKE_TLS_VERIFY: "1"
          SSL_CERT_FILE: "C:\\cacert.pem"
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DSPICE_BUILT_BY="ghactions" `
            -DSPICE_TEST_ARGS=--is-github-actions `
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: |
          cmake --build . --target spicetest_parallel

      - name: Run Test target (bootstrap compiler)
        working-directory: build
        shell: bash
        # The folded BOOTSTRAP_TEST_FILTER above is joined with spaces, which gtest does not accept
        run: GTEST_FILTER="${BOOTSTRAP_TEST_FILTER// /}:${BOOTSTRAP_TEST_FILTER_WINDOWS// /}" cmake --build . --target spicetest_bootstrap_parallel

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --host-compiler build/src/spice.exe

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-win-x64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/AppData/Local/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  build-macos-aarch64:
    name: MacOS/AArch64
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Setup Dependencies
        run: |
          brew update
          brew install ccache graphviz sqlite
          echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          mkdir -p ~/Library/Caches/ccache

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-macos-aarch64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Build test target
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSPICE_BUILT_BY="ghactions" \
            -DSPICE_TEST_ARGS=--is-github-actions \
            ..
          cmake --build . --target spice spicetest

      - name: Run Test target (host compiler)
        working-directory: build
        run: cmake --build . --target spicetest_parallel

      - name: Run Test target (bootstrap compiler)
        working-directory: build
        shell: bash
        # The folded BOOTSTRAP_TEST_FILTER above is joined with spaces, which gtest does not accept
        run: GTEST_FILTER="${BOOTSTRAP_TEST_FILTER// /}" cmake --build . --target spicetest_bootstrap_parallel

      - name: Bootstrap until fixed point
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python bootstrap.py --host-compiler build/src/spice

      - name: Upload bootstrap stage executables
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-stages-macos-aarch64
          path: build/bootstrap
          retention-days: 7

      - name: Save CCache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
