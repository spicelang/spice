name: Format

on:
  pull_request:
    paths:
      - '**.spice'
      - '.github/workflows/format.yml'

jobs:
  check-format:
    name: Check formatting
    runs-on: ubuntu-26.04
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The merge commit of the pull request and its first parent, the tip of the base branch
          fetch-depth: 2

      - name: Collect changed source files
        id: changed
        # test/test-files is left out: its sources are test inputs, whose refs depend on their layout, and some of them do not
        # parse on purpose. Packages under spice_packages are not formatted either
        run: |
          git diff --name-only --diff-filter=d HEAD^1 HEAD -- '*.spice' ':!test/test-files/**' ':!**/spice_packages/**' \
            > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
          if [ -s "$RUNNER_TEMP/changed-files.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch stage0 compiler
        if: steps.changed.outputs.any == 'true'
        # The released compiler, pinned in .github/stage0-version, whose format command checks the files. It is statically
        # linked, so the job needs no toolchain. Changes to the formatter in src/ take effect here with the next stage0 bump
        run: python fetch-stage0.py

      - name: Check formatting
        if: steps.changed.outputs.any == 'true'
        run: |
          status=0
          while IFS= read -r file; do
            # The check prints the path of an unformatted file, or the error, if the file cannot be formatted, e.g. as it does
            # not parse
            if ! output="$(build/stage0/spice format --check "$file" 2>&1)"; then
              status=1
              if [ "$output" = "$file" ]; then
                echo "::error file=$file::File is not formatted. Run 'spice format $file' to format it"
                build/stage0/spice format --stdout "$file" > "$RUNNER_TEMP/formatted.spice"
                diff -u --label "$file" --label "$file (formatted)" "$file" "$RUNNER_TEMP/formatted.spice" || true
              else
                echo "::error file=$file::File cannot be formatted"
                echo "$output"
              fi
            fi
          done < "$RUNNER_TEMP/changed-files.txt"
          exit "$status"
