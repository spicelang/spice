name: Publish documentation

on:
  push:
    branches:
      - main
      - docs/**
      - feature/**
      - fix/**
    paths:
      - docs/**
      - std/**
      - tools/generate_std_docs.py
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-build:
    runs-on: ubuntu-slim
    steps:
      - name: Setup GitHub pages
        uses: actions/configure-pages@v6

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant
          pip install -r docs/requirements.txt

      - name: Generate std library reference
        run: python tools/generate_std_docs.py --nav-out /dev/null

      - name: Build
        working-directory: docs
        run: zensical build --clean

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  # Deploy in a separate job: deploy-pages looks the uploaded artifact up via the artifacts API, which may not list an
  # artifact yet when queried right after uploading it in the same job ("No artifacts named github-pages were found").
  docs-deploy:
    needs: docs-build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v5
        id: deployment
