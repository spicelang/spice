name: CI - ASAN

on:
  # Every Monday at 03:00 UTC
  schedule:
    - cron: '0 3 * * 1'
  # Allow manual triggering
  workflow_dispatch:

env:
  LLVM_VERSION: "llvmorg-23.1.3"
  GCC_VERSION: "16"

jobs:
  build-linux-x86-asan:
    name: CI - Linux/x86_64 compiler with ASAN
    runs-on: ubuntu-26.04
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install ccache ninja-build graphviz uuid-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          mkdir -p ~/.cache/ccache

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        # --tpde builds TPDE into the std, for the TPDE backend of the compiler and the std TPDE bindings
        env:
          LLVM_DIR: ${{ github.workspace }}/llvm/build/lib/cmake/llvm
        run: python setup-deps.py --tpde

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version. It is not instrumented, only the compiler under test, that
        # it builds, gets instrumented with ASAN
        run: python fetch-stage0.py

      - name: Run Test target against the compiler with ASAN
        # Builds the compiler with ASAN, then runs all test cases against it. A test case fails, as soon as the compiler
        # prints a sanitizer report (including leaks) while compiling it
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python test/run-tests.py --build-compiler build/stage0/spice --instrument asan --is-github-actions

  test-programs-linux-x86-asan:
    name: CI - Linux/x86_64 test programs with ASAN
    runs-on: ubuntu-26.04
    # The job runs the downloaded stage0 compiler, which needs no write access and no git credentials
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Dependencies
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install ccache ninja-build graphviz uuid-dev libcurl4-openssl-dev libsqlite3-dev libssl-dev gcc-${{ env.GCC_VERSION }} g++-${{ env.GCC_VERSION }} clang
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          sudo update-alternatives --install /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_VERSION }} 1${{ env.GCC_VERSION }}
          mkdir -p ~/.cache/ccache

      - name: Setup Mold
        uses: rui314/setup-mold@v1

      - name: Restore CCache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Clone LLVM
        run: git clone --depth 1 --branch ${{ env.LLVM_VERSION }} https://github.com/llvm/llvm-project llvm

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/llvm/build
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Build LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        working-directory: llvm
        run: |
          mkdir ./build
          cd ./build
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86;WebAssembly" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            ../llvm
          cmake --build .

      - name: Download Libs
        run: python setup-deps.py

      - name: Fetch stage0 compiler
        # The released compiler, pinned in .github/stage0-version, that builds the compiler under test
        run: python fetch-stage0.py

      - name: Run Test target with ASAN-instrumented test programs
        # Builds every test program with '--sanitizer address' and fails on any AddressSanitizer or LeakSanitizer report.
        # Only the execution output and exit code are compared, since the instrumentation changes the generated code. TPDE is
        # not built, since the TPDE backend is not tested in combination with the sanitizers
        env:
          LLVM_LIB_DIR: ${{ github.workspace }}/llvm/build/lib
          LLVM_INCLUDE_DIRS: -I${{ github.workspace }}/llvm/llvm/include -I${{ github.workspace }}/llvm/build/include
        run: python test/run-tests.py --build-compiler build/stage0/spice --asan --is-github-actions
