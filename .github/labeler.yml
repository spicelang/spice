'compiler':
  - changed-files:
      - any-glob-to-any-file:
          - 'src-host/**/*'
          - 'CMakeLists.txt'
          - '*.cmake'

'bootstrap':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**/*'

'std':
  - changed-files:
      - any-glob-to-any-file:
          - 'std/**/*'

'tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**/*'

'documentation':
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**/*'
          - 'media/specs/**/*'
          - 'AGENTS.md'
          - 'CLAUDE.md'
          - 'README.md'
          - 'SECURITY.md'

'ci':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

'dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'deps/**/*'
          - 'docs/requirements.txt'
