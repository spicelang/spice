name: Setup Linux toolchain
description: >
  Installs the build dependencies and the GCC toolchain on an Ubuntu runner, sets up the wild linker and restores the ccache.
  The ccache is not saved by this action, because composite actions have no post step. Save it at the end of the job with
  actions/cache/save, using the ccache-key output.

inputs:
  packages:
    description: apt packages to install besides GCC and the ones of extra-packages, separated by spaces
    default: ccache ninja-build graphviz uuid-dev libssl-dev clang
  gcc-version:
    description: Major version of GCC to install and make the default
    default: "16"
  extra-packages:
    description: Additional apt packages, separated by spaces
    default: ""
  use-wild:
    description: Install the wild linker and make it the default linker
    default: "true"
  wild-version:
    description: Version of the wild linker to install
    default: "0.11.0"
  use-ccache:
    description: Create the ccache dir and restore the ccache. The packages have to contain ccache
    default: "true"
  ccache-key-suffix:
    description: Optional suffix after the platform in the ccache key, e.g. -coverage
    default: ""

outputs:
  ccache-key:
    description: Key under which the ccache has to be saved at the end of the job
    value: ${{ steps.ccache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Setup Dependencies
      shell: bash
      env:
        GCC_VERSION: ${{ inputs.gcc-version }}
        PACKAGES: ${{ inputs.packages }}
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        USE_CCACHE: ${{ inputs.use-ccache }}
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install "gcc-$GCC_VERSION" "g++-$GCC_VERSION" $PACKAGES $EXTRA_PACKAGES
        sudo update-alternatives --install /usr/bin/gcc gcc "/usr/bin/gcc-$GCC_VERSION" "1$GCC_VERSION"
        sudo update-alternatives --install /usr/bin/g++ g++ "/usr/bin/g++-$GCC_VERSION" "1$GCC_VERSION"
        sudo update-alternatives --install /usr/bin/gcov gcov "/usr/bin/gcov-$GCC_VERSION" "1$GCC_VERSION"
        if [ "$USE_CCACHE" = "true" ]; then
          mkdir -p ~/.cache/ccache
        fi

    - name: Setup Wild
      if: inputs.use-wild == 'true'
      shell: bash
      env:
        WILD_VERSION: ${{ inputs.wild-version }}
      run: |
        WILD_DIST="wild-linker-$WILD_VERSION-$(uname -m)-unknown-linux-gnu"
        curl -fsSL "https://github.com/wild-linker/wild/releases/download/$WILD_VERSION/$WILD_DIST.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        # The Spice compiler looks for wild in /usr/local/bin, clang and GCC look for 'ld.wild' on '-fuse-ld=wild'
        sudo install -m 755 "$RUNNER_TEMP/$WILD_DIST/wild" /usr/local/bin/wild
        sudo ln -sf /usr/local/bin/wild /usr/local/bin/ld.wild
        # Make wild the default linker for everything else, e.g. the LLVM build
        sudo ln -sf /usr/local/bin/wild "$(realpath /usr/bin/ld)"
        wild --version

    - name: Compute ccache key
      id: ccache-key
      if: inputs.use-ccache == 'true'
      shell: bash
      env:
        PREFIX: ccache-${{ runner.os }}-${{ runner.arch }}
        SUFFIX: ${{ inputs.ccache-key-suffix }}
      run: |
        echo "key=$PREFIX$SUFFIX-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        # Fall back to the cache of the same kind of run first, then to the one of any run on this platform
        {
          echo "restore-keys<<EOF"
          if [ -n "$SUFFIX" ]; then echo "$PREFIX$SUFFIX-"; fi
          echo "$PREFIX-"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore CCache
      if: inputs.use-ccache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-key.outputs.key }}
        restore-keys: ${{ steps.ccache-key.outputs.restore-keys }}
