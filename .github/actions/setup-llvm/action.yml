name: Setup LLVM
description: >
  Clones LLVM, builds it (the build is cached) and exports LLVM_DIR, LLVM_LIB_DIR and LLVM_INCLUDE_DIRS for the following
  steps of the job. This action is the single place that pins the LLVM version of the workflows.

inputs:
  llvm-version:
    description: Git tag of the LLVM release to build
    default: llvmorg-23.1.3
  cache-key-suffix:
    description: Platform suffix of the LLVM cache key, e.g. linux-x64
    required: true
  targets:
    description: Value of LLVM_TARGETS_TO_BUILD
    default: AArch64;X86;WebAssembly
  use-ccache:
    description: Build LLVM with ccache as compiler launcher. ccache has to be installed
    default: "true"
  extra-cmake-args:
    description: Additional CMake arguments, separated by spaces
    default: ""

runs:
  using: composite
  steps:
    - name: Clone LLVM
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
      run: git clone --depth 1 --branch "$LLVM_VERSION" https://github.com/llvm/llvm-project llvm

    - name: Cache LLVM
      id: cache-llvm
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/llvm/build
        key: llvm-${{ inputs.llvm-version }}-${{ inputs.cache-key-suffix }}

    - name: Build LLVM
      if: steps.cache-llvm.outputs.cache-hit != 'true'
      shell: bash
      working-directory: llvm
      env:
        LLVM_TARGETS: ${{ inputs.targets }}
        USE_CCACHE: ${{ inputs.use-ccache }}
        EXTRA_CMAKE_ARGS: ${{ inputs.extra-cmake-args }}
      run: |
        mkdir ./build
        cd ./build
        ccache_args=()
        if [ "$USE_CCACHE" = "true" ]; then
          ccache_args=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
        fi
        # EXTRA_CMAKE_ARGS is split into words on purpose
        cmake -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          "${ccache_args[@]}" \
          $EXTRA_CMAKE_ARGS \
          -DLLVM_TARGETS_TO_BUILD="$LLVM_TARGETS" \
          -DLLVM_BUILD_TOOLS=OFF \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -DLLVM_INCLUDE_BENCHMARKS=OFF \
          ../llvm
        cmake --build .

    - name: Export LLVM environment
      shell: bash
      run: |
        # Forward slashes, also on Windows, where the workspace path has backslashes
        workspace="${GITHUB_WORKSPACE//\\//}"
        {
          echo "LLVM_DIR=$workspace/llvm/build/lib/cmake/llvm"
          echo "LLVM_LIB_DIR=$workspace/llvm/build/lib"
          echo "LLVM_INCLUDE_DIRS=-I$workspace/llvm/llvm/include -I$workspace/llvm/build/include"
        } >> "$GITHUB_ENV"
