name: Setup Windows toolchain
description: >
  Installs the build dependencies on a Windows runner and restores the ccache. The ccache is not saved by this action,
  because composite actions have no post step. Save it at the end of the job with actions/cache/save, using the ccache-key output. Git for Windows has to be told to check out symlinks (git config --global core.symlinks true)
  before the checkout step, and MSYS2 (for setup-deps.py) is set up after LLVM was built, so neither is part of this action.

inputs:
  packages:
    description: Chocolatey packages to install, separated by spaces. graphviz is added to the PATH. ccache is needed for use-ccache
    default: graphviz ccache ninja
  use-ccache:
    description: Create the ccache dir and restore the ccache
    default: "true"
  ccache-key-suffix:
    description: Optional suffix after the platform in the ccache key, e.g. -coverage
    default: ""

outputs:
  ccache-key:
    description: Key under which the ccache has to be saved at the end of the job
    value: ${{ steps.ccache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Install Dependencies
      shell: pwsh
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        $packages = @($env:PACKAGES -split ' ' | Where-Object { $_ })
        choco install @packages -y
        if ($packages -contains 'graphviz') {
          echo "C:\Program Files\Graphviz\bin" >> $env:GITHUB_PATH
        }

    - name: Create ccache dir
      if: inputs.use-ccache == 'true'
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path "$env:LOCALAPPDATA\ccache"

    - name: Compute ccache key
      id: ccache-key
      if: inputs.use-ccache == 'true'
      shell: bash
      env:
        PREFIX: ccache-${{ runner.os }}-${{ runner.arch }}
        SUFFIX: ${{ inputs.ccache-key-suffix }}
      run: |
        echo "key=$PREFIX$SUFFIX-${{ github.sha }}" >> "$GITHUB_OUTPUT"
        # Fall back to the cache of the same kind of run first, then to the one of any run on this platform
        {
          echo "restore-keys<<EOF"
          if [ -n "$SUFFIX" ]; then echo "$PREFIX$SUFFIX-"; fi
          echo "$PREFIX-"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore CCache
      if: inputs.use-ccache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ~/AppData/Local/ccache
        key: ${{ steps.ccache-key.outputs.key }}
        restore-keys: ${{ steps.ccache-key.outputs.restore-keys }}
