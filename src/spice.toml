# Manifest of the compiler sources. Spice Shaker installs the packages, that the compiler builds on, into src/spice_packages
# (python fetch-packages.py, which build.py, bootstrap.py and test/run-tests.py run on their own). The released version of the
# compiler comes from its release tag (SPICE_VERSION build variable), not from this file.
[package]
name = "spice"
version = "0.29.4"
description = "Compiler for the Spice programming language"
license = "MIT"
authors = ["Marc Auberer <marc.auberer@chillibits.com>"]
repository = "https://github.com/spicelang/spice"
homepage = "https://www.spicelang.com"
# The stage0 compiler (.github/stage0-version)
spice = ">=0.30.0"
entry = "main.spice"

[dependencies]
llvm = "^0.1.0"
manifest = "^0.1.1"
tpde = "^0.1.0"
