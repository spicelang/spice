# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: "en-US"
early_access: false

knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/STYLE_GUIDE.md"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!deps/**"
    - "!docs/site/**"
    - "!docs/docs/std/**"
    - "!media/**"
  path_instructions:
    - path: "src/**/*.spice"
      instructions: >
        This is the self-hosted compiler written in Spice. Follow the
        Spice-source conventions in STYLE_GUIDE.md.
    - path: "src-next/**/*.spice"
      instructions: >
        Re-implementation of the compiler in Spice, which ports the behavior of src/. Follow the Spice-source
        conventions in STYLE_GUIDE.md and the rules in media/specs/compiler-reimplementation.md (section 10.2): layers,
        ported functions carry a '// legacy:' reference comment.
    - path: "std/**/*.spice"
      instructions: >
        Standard library code. Follow the Spice-source conventions in
        STYLE_GUIDE.md.
    - path: "test/test-files/**"
      instructions: >
        Compiler reference/integration test fixtures. Check that new or
        changed cases follow the layout and reference-file conventions
        described in AGENTS.md rather than flagging them as production code.

chat:
  auto_reply: true
  art: false
